version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: resumepilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumepilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumepilot_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-resumepilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumepilot_user} -d ${POSTGRES_DB:-resumepilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumepilot_backend
    restart: always
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resumepilot_user}:${POSTGRES_PASSWORD:-resumepilot_secure_pass}@postgres:5432/${POSTGRES_DB:-resumepilot_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # React Frontend SPA Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumepilot_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
